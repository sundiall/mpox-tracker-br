                "@type": "Answer",
                "text": "A principal via de transmissão é o contato físico direto e prolongado pele a pele com lesões cutâneas, crostas ou fluidos corporais de uma pessoa infectada (relações sexuais, beijos, abraços) ou contato com objetos/roupas contaminadas."
