name: Atualização Automática de Dados & Deploy MPOX Brasil

on:
  schedule:
    # Checagem horária contínua com gatekeeper adaptativo (07h às 22h BRT em campanha; 2x/dia em calma)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite execução manual a qualquer momento via GitHub Actions
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gatekeeper de Frequência Adaptativa
        id: gatekeeper
        run: |
          python scripts/check_adaptive_run.py

      - name: Executar Pipeline de Coleta de Dados & Agente de Vigilância
        if: steps.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/update_data.py
          python scripts/agentic_monitor.py

      - name: Configurar Node.js
        if: steps.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependências e Compilar Aplicação
        if: steps.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule'
        run: |
          npm ci
          npm run build

      - name: Commit e Push dos Dados Atualizados
        if: steps.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualização automática de dados e RSS [skip ci]" && git push)

      # Opção 1: Deploy no Google Firebase Hosting via Service Account
      - name: Deploy no Firebase Hosting (Service Account)
        if: (steps.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: mpox-tracker-br
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Opção 2: Deploy no Firebase Hosting via FIREBASE_TOKEN
      - name: Deploy no Firebase Hosting (CI Token)
        if: (steps.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') && env.FIREBASE_SERVICE_ACCOUNT == '' && env.FIREBASE_TOKEN != ''
        run: |
          npx firebase-tools deploy --only hosting --project mpox-tracker-br --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Opção 3: Deploy no GitHub Pages (Fallback se não houver credenciais Firebase)
      - name: Deploy no GitHub Pages (Fallback)
        if: (steps.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') && env.FIREBASE_SERVICE_ACCOUNT == '' && env.FIREBASE_TOKEN == ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
