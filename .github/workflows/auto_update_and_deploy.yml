name: Atualização Automática de Dados & Deploy MPOX Brasil

on:
  schedule:
    # 1. Terça-feira 06:00 UTC (03:00 Brasília) - Logo após o fechamento e reprocessamento semanal do Ministério da Saúde / SVSA
    - cron: '0 6 * * 2'
    # 2. Quarta-feira 18:00 UTC (15:00 Brasília) - Segunda checagem para capturar dados consolidados tardios das secretarias estaduais
    - cron: '0 18 * * 3'
    # 3. Dias úteis (Seg-Sex) às 12:00 UTC (09:00 Brasília) - Varredura leve de comunicados técnicos, alertas RSS e vacinas
    - cron: '0 12 * * 1-5'
  workflow_dispatch: # Permite execução manual a qualquer momento via GitHub Actions
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Pipeline de Coleta de Dados (RSS & SUS)
        run: |
          python scripts/update_data.py

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependências e Compilar Aplicação
        run: |
          npm ci
          npm run build

      - name: Commit e Push dos Dados Atualizados
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualização automática de dados e RSS [skip ci]" && git push)

      # Opção 1: Deploy no Google Firebase Hosting via Service Account
      - name: Deploy no Firebase Hosting (Service Account)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: mpox-tracker-br
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Opção 2: Deploy no Firebase Hosting via FIREBASE_TOKEN
      - name: Deploy no Firebase Hosting (CI Token)
        if: env.FIREBASE_SERVICE_ACCOUNT == '' && env.FIREBASE_TOKEN != ''
        run: |
          npx firebase-tools deploy --only hosting --project mpox-tracker-br --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Opção 3: Deploy no GitHub Pages (Fallback se não houver credenciais Firebase)
      - name: Deploy no GitHub Pages (Fallback)
        if: env.FIREBASE_SERVICE_ACCOUNT == '' && env.FIREBASE_TOKEN == ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
